<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>画境 · 捏脸</title>
  <meta name="description" content="按脸型、眼睛、发型、妆容四大维度搭建角色面部，实时生成可直接使用的中英提示词。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23425a46'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fffdf8' font-family='serif'%3E境%3C/text%3E%3C/svg%3E">
  <script>
    ;(function () {
      try {
        var pref = localStorage.getItem('huajing-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (_) {}
    })()
  </script>
  <script>
    ;(function () {
      function applyScale() {
        var z = Math.min(1.25, Math.max(1, window.innerWidth / 1440))
        var root = document.documentElement
        root.style.setProperty('--ui-zoom', String(z))
        root.style.setProperty('--ui-vh', window.innerHeight / z + 'px')
      }
      applyScale()
      window.addEventListener('resize', applyScale, { passive: true })
      window.addEventListener('orientationchange', applyScale)
    })()
  </script>
  <link rel="stylesheet" href="/src/ui/tokens.css">
  <link rel="stylesheet" href="/src/face-app/styles/app.css">
  <link rel="stylesheet" href="/src/face-app/styles/cards.css">
  <link rel="stylesheet" href="/src/face-app/styles/panel.css">
  <link rel="stylesheet" href="/src/face-app/styles/huajing.css">
</head>
<body class="is-booting">
  <div class="face-loading" id="face-loading">
    <div class="face-loading-card">
      <span class="face-loading-mark">境</span>
      <strong>正在打开捏脸工作台</strong>
      <p>确认登录状态，并读取服务端卡片目录…</p>
    </div>
  </div>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5H6a2 2 0 0 0-2 2v9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h10a5 5 0 0 1 0 10H8M4 9l4-4M4 9l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7z"/><path d="M18.5 15.5l.7 2.1 2.1.7-2.1.7-.7 2.1-.7-2.1-2.1-.7 2.1-.7z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 15v4h14v-4"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19L16 8M14 4l1 3 3 1-3 1-1 3-1-3-3-1 3-1zM19 12l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 4h4v4M20 4l-6 6M4 20l6-6M16 20h4v-4M20 20l-6-6M4 4l6 6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6v-2.6h.4A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1A1.7 1.7 0 0 0 11.4 6 1.7 1.7 0 0 0 12.4 4.4V4h2.6v.4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v2.6H21a1.7 1.7 0 0 0-1.6 1z"/></symbol>
  </svg>

  <header class="topbar">
    <a class="back-link" href="/batch.html" title="返回创作台" aria-label="返回创作台">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 6-6 6 6 6"></path></svg>
      <span>创作台</span>
    </a>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M12 25c0-7 3.6-12 8-12s8 5 8 12" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M15.5 18.5h2.2M22.3 18.5h2.2M17.6 24.6c1.5 1 3.3 1 4.8 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>画境 · 捏脸</strong>
        <small>FACE ATELIER</small>
      </span>
    </div>

    <div class="scheme">
      <input id="scheme-name" class="scheme-name" value="未命名角色" aria-label="方案名称" maxlength="40" spellcheck="false">
      <span id="save-state" class="save-state">已自动保存</span>
    </div>

    <div class="top-actions">
      <label class="style-select">
        <span>视觉风格</span>
        <select id="visual-style" aria-label="视觉风格"></select>
      </label>
      <button class="btn ghost" id="open-presets" type="button"><svg><use href="#i-spark"/></svg>预设</button>
      <div class="random-control">
        <button class="btn ghost random-btn" id="randomize-btn" type="button" title="随机生成一套角色参数"><svg><use href="#i-shuffle"/></svg><span>随机</span></button>
        <button class="icon-btn random-settings-btn" id="random-settings-btn" type="button"
          aria-label="随机设置" aria-haspopup="dialog" aria-expanded="false" title="随机设置"><svg><use href="#i-settings"/></svg></button>
        <div class="random-popover" id="random-settings" role="dialog" aria-label="随机设置" hidden>
          <div class="random-popover-head">
            <strong>随机设置</strong>
            <span>只影响特征参数</span>
          </div>
          <div class="random-scope-field">
            <div class="random-scope-title">
              <b>性别范围</b>
              <small id="random-scope-state">同性优先，含中性</small>
            </div>
            <div class="random-scope" id="random-gender-scope" role="radiogroup" aria-label="随机性别范围">
              <button type="button" role="radio" data-random-scope="any" aria-checked="false">不限</button>
              <button type="button" role="radio" data-random-scope="mixed" aria-checked="true">同性 + 中性</button>
              <button type="button" role="radio" data-random-scope="same-only" aria-checked="false">仅同性</button>
            </div>
          </div>
          <p id="random-gender-hint">当前：女性呈现</p>
        </div>
      </div>
      <button class="btn ghost" id="new-scheme" type="button"><svg><use href="#i-plus"/></svg>新建</button>
      <div class="menu-wrap">
        <button class="btn ghost" id="more-btn" type="button" aria-haspopup="menu"><svg><use href="#i-menu"/></svg>方案</button>
        <div class="menu" id="more-menu" hidden>
          <button data-act="duplicate">复制当前方案</button>
          <button data-act="rename">重命名</button>
          <button data-act="import">导入 JSON</button>
          <button data-act="delete" class="danger">删除当前方案</button>
        </div>
      </div>
      <button class="btn gold" id="export-btn" type="button" aria-haspopup="menu"><svg><use href="#i-download"/></svg>导出<svg class="caret"><use href="#i-chevron"/></svg></button>
      <div class="menu" id="export-menu" hidden>
        <button data-act="copy-full">复制完整提示词</button>
        <button data-act="copy-negative">复制负向提示词</button>
        <button data-act="export-md">导出 Markdown</button>
        <button data-act="export-json">导出 JSON</button>
      </div>
      <button class="btn moss" id="handoff-btn" type="button" title="把当前提示词带入自由创作">
        <svg><use href="#i-arrow"/></svg>带入自由创作
      </button>
      <button class="icon-btn" id="open-search" type="button" aria-label="搜索特征"><svg><use href="#i-search"/></svg></button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="side-search">
        <svg class="search-ico"><use href="#i-search"/></svg>
        <input id="side-search-input" type="search" placeholder="搜索中英文名称、别名" aria-label="搜索特征">
        <kbd>/</kbd>
      </div>

      <div class="quick-row">
        <button class="quick-chip" data-quick="favorites" type="button"><svg><use href="#i-star"/></svg>收藏</button>
        <button class="quick-chip" data-quick="recent" type="button">最近使用</button>
      </div>

      <div class="mobile-groups" id="mobile-groups" aria-label="模块分组"></div>
      <nav class="nav" id="nav" aria-label="维度导航"></nav>

      <section class="role-card">
        <header>
          <span>角色设定</span>
          <small>可选</small>
        </header>
        <div class="role-grid">
          <label>性别呈现
            <select id="gender">
              <option value="女性呈现">女性呈现</option>
              <option value="男性呈现">男性呈现</option>
              <option value="中性呈现">中性呈现</option>
              <option value="">不指定</option>
            </select>
          </label>
          <label>年龄段
            <select id="age">
              <option value="青年">青年</option>
              <option value="成年">成年</option>
              <option value="中年">中年</option>
              <option value="">不指定</option>
            </select>
          </label>
          <label class="full">角色定位
            <input id="role" type="text" placeholder="如：清冷女帝 / 少年剑客" maxlength="30">
          </label>
          <label class="full">补充描述
            <textarea id="custom-notes" rows="2" placeholder="手动补充：指定的泪痣位置、特殊纹样、必须保留的细节……"></textarea>
          </label>
        </div>
      </section>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <div class="crumbs">
          <span id="crumb-group">脸型与面部结构</span>
          <svg><use href="#i-chevron"/></svg>
          <span class="muted" id="crumb-count">12 个维度</span>
        </div>
        <div class="head-row">
          <div>
            <h1 id="cat-title">整体脸型</h1>
            <p id="cat-blurb">决定角色辨识度的外轮廓；先定型，再叠加骨相与软组织。</p>
          </div>
          <div class="head-side">
            <span class="mode-badge" id="cat-mode">单选</span>
            <button class="text-btn reset-blank" id="reset-all" type="button">恢复空白</button>
            <button class="text-btn" id="clear-category" type="button">清空本维度</button>
          </div>
        </div>
        <div class="mood-row" id="mood-row"></div>
      </div>

      <div class="cards-wrap">
        <div class="cards" id="cards"></div>
        <div class="empty" id="empty" hidden>
          <svg><use href="#i-search"/></svg>
          <h3>没有匹配的特征</h3>
          <p>换个关键词，或清除气质筛选再试。</p>
          <button class="btn ghost" id="reset-filter" type="button">清除筛选</button>
        </div>
      </div>

      <footer class="stage-foot">
        <span id="selection-summary">尚未选择</span>
        <span class="dot"></span>
        <span id="coverage">参考图 36 / 592</span>
      </footer>
    </main>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <div>
          <h2>提示词</h2>
          <p>内容随选择自动生成，只读；可以滚动、全选和复制。</p>
        </div>
        <button class="icon-btn panel-close" id="panel-close" type="button" aria-label="收起提示词"><svg><use href="#i-close"/></svg></button>
      </div>

      <div class="conflict-box" id="conflict-box" hidden></div>

      <div class="tabs" role="tablist" aria-label="提示词类型">
        <button class="tab is-active" data-tab="full" role="tab" aria-selected="true">完整提示词</button>
        <button class="tab" data-tab="negative" role="tab" aria-selected="false">负向</button>
        <button class="tab" data-tab="structure" role="tab" aria-selected="false">结构化设定</button>
        <button class="tab" data-tab="refs" role="tab" aria-selected="false">参考图</button>
      </div>

      <div class="modes" id="modes">
        <div class="seg" data-group="lang" role="group" aria-label="语言">
          <button data-val="zh" class="is-active">中文</button>
          <button data-val="en">English</button>
          <button data-val="both">双语</button>
        </div>
        <div class="seg" data-group="length" role="group" aria-label="长度">
          <button data-val="full" class="is-active">完整</button>
          <button data-val="compact">精简</button>
        </div>
        <div class="seg" data-group="shot" role="group" aria-label="用途">
          <button data-val="portrait" class="is-active">半身参考</button>
          <button data-val="headshot">定妆照</button>
          <button data-val="turnaround">三视图</button>
        </div>
      </div>

      <div class="editor" id="editor-full">
        <textarea id="prompt-full" spellcheck="false" readonly aria-readonly="true"
          title="由所选特征自动生成，不能直接编辑" aria-label="完整提示词，只读"></textarea>
        <div class="manual-badge" id="manual-full" hidden>
          已手动编辑
          <button type="button" data-restore="full"><svg><use href="#i-undo"/></svg>恢复自动生成</button>
        </div>
      </div>

      <div class="editor" id="editor-negative" hidden>
        <textarea id="prompt-negative" spellcheck="false" readonly aria-readonly="true"
          title="由所选特征自动生成，不能直接编辑" aria-label="负向提示词，只读"></textarea>
        <div class="manual-badge" id="manual-negative" hidden>
          已手动编辑
          <button type="button" data-restore="negative"><svg><use href="#i-undo"/></svg>恢复自动生成</button>
        </div>
      </div>

      <div class="structure" id="structure" hidden></div>
      <div class="refs" id="refs" hidden></div>

      <div class="panel-foot">
        <div class="counts"><span id="char-count">0 字</span><span id="neg-count" hidden>0 词</span></div>
        <div class="foot-actions">
          <button class="btn ghost sm" id="copy-btn" type="button"><svg><use href="#i-copy"/></svg><span>复制</span></button>
          <button class="btn gold sm" id="export-md-btn" type="button"><svg><use href="#i-download"/></svg>Markdown</button>
        </div>
      </div>
    </aside>
  </div>

  <button class="panel-toggle" id="panel-toggle" type="button">
    <svg><use href="#i-wand"/></svg>
    <span>查看提示词</span>
    <b id="panel-toggle-count">0</b>
  </button>

  <div class="overlay" id="search-overlay" hidden>
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="全局搜索">
      <div class="search-top">
        <svg><use href="#i-search"/></svg>
        <input id="global-search-input" type="search" placeholder="搜索所有特征：脸型、眼型、刘海、发色、妆容……" autocomplete="off">
        <button class="icon-btn" id="close-search" type="button" aria-label="关闭搜索"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="search-body" id="search-results"></div>
      <div class="search-hint">输入中文名、英文名或别名；回车打开第一条。</div>
    </div>
  </div>

  <div class="overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json" hidden>

  <script type="module" src="/src/face-app/main.js"></script>
</body>
</html>
