<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>画境 · 运行日志</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f7f7f7;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --surface-subtle: #f5f5f5;
    --ink: #1a1a1a;
    --ink-soft: #666666;
    --ink-faint: #858585;
    --line: rgba(0, 0, 0, 0.14);
    --line-soft: rgba(0, 0, 0, 0.08);
    --line-strong: rgba(0, 0, 0, 0.24);
    --moss: #1a1a1a;
    --moss-dark: #000000;
    --moss-tint: rgba(0, 0, 0, 0.06);
    --on-moss: #ffffff;
    --gold: #b45309;
    --danger: #b91c1c;
    --radius-sm: 8px;
    --radius-md: 10px;
    --shadow-soft: 0 3px 12px rgba(15, 23, 42, 0.05);
    --font-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Mono", "Consolas", "Sarasa Mono SC", "Microsoft YaHei", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #0f0f0f;
      --surface: #1a1a1a;
      --surface-raised: #242424;
      --surface-subtle: #1f1f1f;
      --ink: #f5f5f5;
      --ink-soft: #b8b8b8;
      --ink-faint: #999999;
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.26);
      --moss: #f5f5f5;
      --moss-dark: #d4d4d4;
      --moss-tint: rgba(255, 255, 255, 0.1);
      --on-moss: #0d0d0d;
      --gold: #d6a35f;
      --danger: #e88f80;
      --shadow-soft: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    box-shadow: var(--shadow-soft);
  }

  .bar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    font-size: 12px;
    white-space: nowrap;
  }

  .field.grow {
    flex: 1 1 220px;
    min-width: 180px;
  }

  .field.grow input {
    flex: 1;
    min-width: 120px;
  }

  select,
  input[type="search"] {
    min-height: 34px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 120ms cubic-bezier(0.2, 0.75, 0.2, 1), box-shadow 120ms cubic-bezier(0.2, 0.75, 0.2, 1);
  }

  select {
    max-width: 240px;
  }

  select:focus,
  input[type="search"]:focus {
    border-color: var(--moss);
    box-shadow: 0 0 0 3px var(--moss-tint);
  }

  select:disabled {
    opacity: 0.6;
  }

  input[type="search"]::placeholder {
    color: var(--ink-faint);
  }

  .button {
    min-height: 34px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background 120ms cubic-bezier(0.2, 0.75, 0.2, 1), border-color 120ms cubic-bezier(0.2, 0.75, 0.2, 1),
      color 120ms cubic-bezier(0.2, 0.75, 0.2, 1);
  }

  .button:hover:not(:disabled) {
    border-color: var(--line-strong);
  }

  .button:active:not(:disabled) {
    transform: translateY(1px);
  }

  .button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .button.primary {
    border-color: transparent;
    background: var(--moss);
    color: var(--on-moss);
  }

  .button.primary:hover:not(:disabled) {
    background: var(--moss-dark);
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 2px;
    color: var(--ink-soft);
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .switch input {
    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: var(--moss);
    cursor: pointer;
  }

  .meta {
    color: var(--ink-faint);
    font-size: 12px;
  }

  .meta-status {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    flex: 1 1 auto;
    min-width: 0;
  }

  #status {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #counter {
    flex: none;
    white-space: nowrap;
  }

  .meta-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  @media (max-width: 640px) {
    .field.grow {
      flex-basis: 100%;
    }

    .meta-actions {
      flex-wrap: wrap;
    }
  }

  .view {
    position: relative;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--surface);
    border-top: 1px solid var(--line-soft);
  }

  .lines {
    padding: 8px 0 16px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.6;
  }

  .line {
    padding: 1px 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: var(--ink);
  }

  .line:hover {
    background: var(--surface-subtle);
  }

  .line.warn {
    color: var(--gold);
  }

  .line.error {
    color: var(--danger);
  }

  .line.debug {
    color: var(--ink-faint);
  }

  .empty {
    margin: 0;
    padding: 48px 16px;
    color: var(--ink-faint);
    font-size: 13px;
    text-align: center;
  }

  .empty[hidden] {
    display: none;
  }

  .view::-webkit-scrollbar {
    width: 10px;
  }

  .view::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 999px;
    background: var(--line-strong);
    background-clip: padding-box;
  }

  .view::-webkit-scrollbar-thumb:hover {
    background: var(--ink-faint);
    background-clip: padding-box;
  }

  /* 结构化日志行：时间 + 级别 + 消息，命中的请求再补一行方法和状态 */
  .log-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .log-stat {
    padding: 2px 9px;
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    background: var(--surface-subtle);
    color: var(--ink-soft);
    font-size: 11.5px;
    white-space: nowrap;
  }

  .log-stat.warn { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 35%, transparent); }
  .log-stat.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  .log-item { border-bottom: 1px solid var(--line-soft); }

  .log-row {
    display: grid;
    grid-template-columns: 74px 52px minmax(0, 1fr);
    gap: 10px;
    padding: 7px 12px;
    cursor: pointer;
    align-items: start;
  }

  .log-row:hover { background: var(--surface-subtle); }

  .log-time {
    color: var(--ink-faint);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.7;
  }

  .log-level {
    justify-self: start;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    color: var(--ink-soft);
    font-size: 10.5px;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  .log-level.warn { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 35%, transparent); background: var(--gold-tint); }
  .log-level.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: var(--danger-tint); }
  .log-level.debug { color: var(--ink-faint); }

  .log-main { min-width: 0; }
  .log-msg { margin: 0; color: var(--ink); font-size: 12.5px; line-height: 1.65; word-break: break-word; }

  .log-req {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 3px;
    color: var(--ink-soft);
    font-size: 11.5px;
  }

  .log-req code {
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 11.5px;
    word-break: break-all;
  }

  .log-req .method {
    padding: 0 6px;
    border-radius: 5px;
    background: var(--surface-subtle);
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 10.5px;
  }

  .log-req .status { font-family: var(--font-mono); }
  .log-req .status.ok { color: var(--success); }
  .log-req .status.warn { color: var(--gold); }
  .log-req .status.error { color: var(--danger); }
  .log-req .dur { color: var(--ink-faint); font-family: var(--font-mono); }

  .log-detail {
    margin: 0 12px 10px 136px;
    padding: 10px 12px;
    max-height: 320px;
    overflow: auto;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    background: var(--surface-subtle);
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  @media (max-width: 620px) {
    .log-row { grid-template-columns: 64px 46px minmax(0, 1fr); }
    .log-detail { margin-left: 12px; }
  }
</style>
</head>
<body>
  <header class="bar">
    <div class="bar-row">
      <label class="field">
        <span>文件</span>
        <select id="file-select" aria-label="日志文件"></select>
      </label>
      <label class="switch">
        <input type="checkbox" id="follow" checked />
        <span>跟随最新</span>
      </label>
      <button type="button" id="pause" class="button">暂停</button>
      <label class="field">
        <span>级别</span>
        <select id="level-filter" aria-label="日志级别">
          <option value="0">全部</option>
          <option value="20">调试及以上</option>
          <option value="30">信息及以上</option>
          <option value="40">警告及以上</option>
          <option value="50">仅错误</option>
        </select>
      </label>
      <label class="field grow">
        <span>过滤</span>
        <input id="filter" type="search" placeholder="输入关键字，只筛显示不动缓冲" />
      </label>
    </div>
    <div class="bar-row meta">
      <span class="meta-status">
        <span id="status">正在读取…</span>
        <span id="counter"></span>
      </span>
      <div class="meta-actions">
        <button type="button" id="export" class="button">导出筛选结果</button>
        <button type="button" id="clear" class="button">清空视图</button>
        <button type="button" id="copy" class="button">复制当前内容</button>
        <button type="button" id="open-dir" class="button primary">打开日志目录</button>
      </div>
    </div>
    <div class="bar-row meta">
      <div class="log-stats" id="log-stats">
        <span class="log-stat" id="stat-total">0 行</span>
        <span class="log-stat" id="stat-requests">0 请求</span>
        <span class="log-stat warn" id="stat-warn">0 警告</span>
        <span class="log-stat error" id="stat-errors">0 错误</span>
      </div>
    </div>
  </header>

  <main id="view" class="view" role="log" aria-live="polite">
    <div id="lines" class="lines"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

<script>
  const POLL_MS = 1200
  const LIST_MS = 10000
  const MAX_LINES = 2000
  const DATE_RE = /^\d{4}-\d{2}-\d{2}\.log$/
  const PREFIX_RE = /^\s*\[[^\]]*\]\s*/
  const SOURCE_RE = /^\[(?:server|server:err|panel|panel:err)\]\s*/

  const api = window.logsApi
  const els = {
    files: document.getElementById('file-select'),
    follow: document.getElementById('follow'),
    pause: document.getElementById('pause'),
    level: document.getElementById('level-filter'),
    export: document.getElementById('export'),
    statTotal: document.getElementById('stat-total'),
    statRequests: document.getElementById('stat-requests'),
    statWarn: document.getElementById('stat-warn'),
    statErrors: document.getElementById('stat-errors'),
    filter: document.getElementById('filter'),
    clear: document.getElementById('clear'),
    copy: document.getElementById('copy'),
    openDir: document.getElementById('open-dir'),
    lines: document.getElementById('lines'),
    empty: document.getElementById('empty'),
    status: document.getElementById('status'),
    counter: document.getElementById('counter'),
    view: document.getElementById('view'),
  }

  const state = {
    files: [],
    file: '',
    offset: 0,
    size: 0,
    lines: [],
    pending: '',
    decoder: new TextDecoder('utf-8'),
    paused: false,
    follow: true,
    minLevel: 0,
    filter: '',
    visible: [],
    cleared: false,
    dirty: false,
    reading: false,
    listedAt: 0,
    status: '',
  }

  function escapeHtml(value) {
    return value.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch])
  }

  function bytesText(size) {
    if (!size) return '0 B'
    if (size < 1024) return `${size} B`
    if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`
    return `${(size / 1024 / 1024).toFixed(1)} MB`
  }

  function clockText(value) {
    if (!value) return ''
    const date = new Date(value)
    return Number.isNaN(date.getTime()) ? '' : date.toTimeString().slice(0, 8)
  }

  function stripPrefix(raw) {
    let rest = raw.replace(PREFIX_RE, '')
    if (SOURCE_RE.test(rest)) rest = rest.replace(SOURCE_RE, '')
    return rest
  }

  function parseTimestamp(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value
    if (typeof value === 'string' && value.trim()) {
      const parsed = Date.parse(value)
      if (Number.isFinite(parsed)) return parsed
    }
    return null
  }

  function makeEntry(raw) {
    const body = stripPrefix(raw)
    let data = null
    if (body.startsWith('{')) {
      try { data = JSON.parse(body) } catch { data = null }
    }
    const levelRaw = Number(data?.level)
    const level = Number.isFinite(levelRaw) ? levelRaw : 30
    const message =
      typeof data?.msg === 'string'
        ? data.msg
        : typeof data?.message === 'string'
          ? data.message
          : data
            ? ''
            : raw
    const time = parseTimestamp(data?.time ?? data?.timestamp)

    let request = null
    if (data?.req && typeof data.req === 'object') {
      const req = data.req
      const res = data.res && typeof data.res === 'object' ? data.res : null
      const method = typeof req.method === 'string' ? req.method : ''
      const url = typeof req.url === 'string' ? req.url : ''
      if (method || url) {
        request = {
          method,
          url,
          status: Number(res?.statusCode) || 0,
          ms: Number(data.responseTime) || 0,
          reqId: typeof data.reqId === 'string' ? data.reqId : '',
        }
      }
    }

    const searchText = [message, request?.method, request?.url, raw]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()

    return {
      level,
      time,
      message,
      request,
      raw: body,
      text: [clockText(time), message].filter(Boolean).join('  '),
      searchText,
      detail: data ? JSON.stringify(data, null, 2) : body,
    }
  }

  function pushLine(raw) {
    const text = raw.endsWith('\r') ? raw.slice(0, -1) : raw
    state.lines.push(makeEntry(text))
    if (state.lines.length > MAX_LINES) state.lines.splice(0, state.lines.length - MAX_LINES)
    state.cleared = false
    state.dirty = true
  }

  function feed(text) {
    state.pending += text
    const cut = state.pending.lastIndexOf('\n')
    if (cut < 0) {
      if (state.pending.length > 65536) {
        pushLine(state.pending)
        state.pending = ''
      }
      return
    }
    const block = state.pending.slice(0, cut)
    state.pending = state.pending.slice(cut + 1)
    for (const raw of block.split('\n')) pushLine(raw)
  }

  function renderEmpty(count) {
    let message = ''
    if (!state.files.length || !state.file) message = '还没有日志文件'
    else if (!count) message = state.lines.length || state.cleared ? '' : '这个文件是空的'
    els.empty.textContent = message
    els.empty.hidden = !message
  }

  function toneOf(line) {
    return line.level >= 50 ? 'error' : line.level >= 40 ? 'warn' : line.level >= 30 ? 'info' : 'debug'
  }

  function levelLabel(tone) {
    return tone === 'error' ? 'ERR' : tone === 'warn' ? 'WARN' : tone === 'info' ? 'INFO' : 'DEBUG'
  }

  function requestHtml(request) {
    if (!request) return ''
    const statusTone = request.status >= 500 ? 'error' : request.status >= 400 ? 'warn' : 'ok'
    return `<p class="log-req">${request.method ? `<span class="method">${escapeHtml(request.method)}</span>` : ''}<code>${escapeHtml(request.url)}</code>${request.status ? `<span class="status ${statusTone}">${request.status}</span>` : ''}${request.ms ? `<span class="dur">${Math.round(request.ms)}ms</span>` : ''}</p>`
  }

  function renderLines() {
    const keyword = state.filter.trim().toLowerCase()
    const visible = state.lines.filter(line => {
      if (line.level < state.minLevel) return false
      if (keyword && !line.searchText.includes(keyword)) return false
      return true
    })
    state.visible = visible
    els.lines.innerHTML = visible
      .map((line, index) => {
        const tone = toneOf(line)
        const time = line.time ? clockText(line.time) : ''
        const detail = line.detail
          ? `<pre class="log-detail" hidden>${escapeHtml(line.detail)}</pre>`
          : ''
        return `<div class="log-item">
          <div class="log-row" data-index="${index}">
            <span class="log-time">${escapeHtml(time)}</span>
            <span class="log-level ${tone}">${levelLabel(tone)}</span>
            <div class="log-main"><p class="log-msg">${escapeHtml(line.message || '（无消息）')}</p>${requestHtml(line.request)}</div>
          </div>
          ${detail}
        </div>`
      })
      .join('')
    els.counter.textContent = countText(visible.length)
    updateStats()
    renderEmpty(visible.length)
    if (state.follow && state.file) els.view.scrollTop = els.view.scrollHeight
  }

  function updateStats() {
    const total = state.lines.length
    const requests = state.lines.filter(line => line.request).length
    const warnings = state.lines.filter(line => line.level >= 40 && line.level < 50).length
    const errors = state.lines.filter(line => line.level >= 50).length
    els.statTotal.textContent = `${total} 行`
    els.statRequests.textContent = `${requests} 请求`
    els.statWarn.textContent = `${warnings} 警告`
    els.statErrors.textContent = `${errors} 错误`
  }

  function countText(visible) {
    if (!state.file) return ''
    const keyword = state.filter.trim()
    const parts = []
    if (state.minLevel) parts.push('按级别')
    if (keyword) parts.push('含关键字')
    if (parts.length) return `筛出 ${visible} / ${state.lines.length} 行（${parts.join('，')}）`
    return `已读 ${state.lines.length} 行`
  }

  function renderStatus() {
    if (state.status) {
      els.status.textContent = state.status
      return
    }
    if (state.paused) {
      els.status.textContent = '已暂停，点「继续」接着读'
      return
    }
    if (!state.file) {
      els.status.textContent = api ? '等待日志文件' : '日志接口不可用：请在画境桌面端里打开这个窗口'
      return
    }
    els.status.textContent = `${state.file} · ${state.offset >= state.size ? '已读完' : '读取中'} · ${bytesText(state.size)}`
  }

  function renderFiles() {
    if (!state.files.length) {
      els.files.innerHTML = '<option value="">没有日志文件</option>'
      els.files.disabled = true
      return
    }
    els.files.disabled = false
    els.files.innerHTML = state.files
      .map(file => `<option value="${escapeHtml(file.name)}">${escapeHtml(file.name)}</option>`)
      .join('')
    els.files.value = state.file
  }

  async function readMore() {
    if (!api || state.reading || !state.file) return
    state.reading = true
    try {
      for (let step = 0; step < 32; step += 1) {
        const result = await api.readFrom(state.file, state.offset)
        if (!result) break
        const chunk = result.chunk
        if (chunk instanceof Uint8Array) {
          if (chunk.byteLength) feed(state.decoder.decode(chunk, { stream: true }))
        } else if (typeof chunk === 'string' && chunk) {
          feed(chunk)
        }
        const size = Number(result.size) || 0
        const next = Number(result.offset) || 0
        const advanced = next > state.offset
        state.size = size
        state.offset = next
        if (!advanced || state.offset >= size) break
      }
      state.status = ''
    } catch (error) {
      state.status = `读取失败：${error?.message || error}`
    } finally {
      state.reading = false
      if (state.dirty) {
        state.dirty = false
        renderLines()
      }
      renderStatus()
    }
  }

  async function switchTo(name) {
    if (!name || name === state.file) return
    state.file = name
    state.offset = 0
    state.size = 0
    state.lines = []
    state.pending = ''
    state.decoder = new TextDecoder('utf-8')
    state.cleared = false
    state.status = ''
    els.files.value = name
    renderLines()
    renderStatus()
    await readMore()
  }

  function newestDatedName() {
    // 文件名就是日期，直接按名字取最大的那个：mtime 可能被复制/迁移改乱，名字不会
    let newest = ''
    for (const file of state.files) {
      if (!DATE_RE.test(file.name)) continue
      if (file.name > newest) newest = file.name
    }
    return newest
  }

  async function refreshList(force) {
    if (!api) return
    if (!force && Date.now() - state.listedAt < LIST_MS) return
    state.listedAt = Date.now()
    let files = []
    try {
      files = await api.listFiles()
    } catch (error) {
      state.status = `读取日志列表失败：${error?.message || error}`
      renderStatus()
      return
    }
    state.files = Array.isArray(files) ? files : []

    const names = state.files.map(file => file.name)
    if (state.file && !names.includes(state.file)) {
      state.file = ''
      state.offset = 0
      state.size = 0
      state.lines = []
      state.pending = ''
      state.cleared = false
      state.dirty = true
    }

    const newest = newestDatedName()
    renderFiles()
    if (!state.file) {
      const start = newest || state.files[0]?.name || ''
      if (start) {
        await switchTo(start)
        return
      }
    } else if (state.follow && DATE_RE.test(state.file) && newest && newest !== state.file) {
      // 跟随只在出现更新的日期文件时换；desktop.log 的 mtime 变化不触发
      await switchTo(newest)
      return
    }
    if (state.dirty) {
      state.dirty = false
      renderLines()
    }
    renderStatus()
  }

  async function poll() {
    if (!api || state.paused) return
    await refreshList(false)
    await readMore()
  }

  function legacyCopy(text) {
    const area = document.createElement('textarea')
    area.value = text
    area.setAttribute('readonly', '')
    area.style.position = 'fixed'
    area.style.top = '-1000px'
    document.body.appendChild(area)
    area.select()
    let ok = false
    try {
      ok = document.execCommand('copy')
    } catch {
      ok = false
    }
    area.remove()
    return ok
  }

  function flashButton(button, label, restore) {
    button.textContent = label
    button.disabled = true
    setTimeout(() => {
      button.textContent = restore
      button.disabled = false
    }, 1200)
  }

  function flash(label) {
    els.copy.textContent = label
    els.copy.disabled = true
    setTimeout(() => {
      els.copy.textContent = '复制当前内容'
      els.copy.disabled = false
    }, 1200)
  }

  els.files.addEventListener('change', () => {
    void switchTo(els.files.value)
  })

  els.follow.addEventListener('change', () => {
    state.follow = els.follow.checked
    if (state.follow) {
      state.listedAt = 0
      void poll()
    }
  })

  els.pause.addEventListener('click', () => {
    state.paused = !state.paused
    els.pause.textContent = state.paused ? '继续' : '暂停'
    els.pause.classList.toggle('primary', state.paused)
    renderStatus()
    if (!state.paused) void poll()
  })

  els.filter.addEventListener('input', () => {
    state.filter = els.filter.value
    renderLines()
  })

  els.level.addEventListener('change', () => {
    state.minLevel = Number(els.level.value) || 0
    renderLines()
  })

  els.lines.addEventListener('click', event => {
    const row = event.target.closest('.log-row')
    if (!row) return
    const detail = row.parentElement?.querySelector('.log-detail')
    if (detail) detail.hidden = !detail.hidden
  })

  els.export.addEventListener('click', async () => {
    const text = state.visible.map(line => line.raw).join('\n')
    if (!text) {
      flashButton(els.export, '没有可导出内容', '导出筛选结果')
      return
    }
    const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)
    if (api?.exportFile) {
      const result = await api.exportFile(text, `huajing-log-${stamp}.log`)
      flashButton(els.export, result?.ok ? '已导出' : result?.canceled ? '已取消' : '导出失败', '导出筛选结果')
      return
    }
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' })
    const link = document.createElement('a')
    link.href = URL.createObjectURL(blob)
    link.download = `huajing-log-${stamp}.log`
    link.click()
    URL.revokeObjectURL(link.href)
    flashButton(els.export, '已导出', '导出筛选结果')
  })

  els.clear.addEventListener('click', () => {
    state.lines = []
    state.cleared = true
    els.lines.innerHTML = ''
    els.counter.textContent = ''
    renderEmpty(0)
  })

  els.copy.addEventListener('click', async () => {
    const text = state.visible.map(line => line.raw).join('\n')
    if (!text) {
      flash('没有可复制的内容')
      return
    }
    let ok = false
    try {
      await navigator.clipboard.writeText(text)
      ok = true
    } catch {
      ok = legacyCopy(text)
    }
    flash(ok ? '已复制' : '复制失败')
  })

  els.openDir.addEventListener('click', () => {
    if (api) void api.openDir()
  })

  renderStatus()
  if (api) {
    void refreshList(true)
    setInterval(() => {
      void poll()
    }, POLL_MS)
  }
</script>
</body>
</html>
